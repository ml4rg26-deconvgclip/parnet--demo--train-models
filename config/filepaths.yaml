# config/filepaths.yaml
#
# Relative paths are resolved from the project root (directory containing pixi.toml).
# Absolute paths point to NAS-resident files that require /mnt/storage-nas-fast-2 to be mounted.

# ── Files available locally (copied into resources/) ────────────────────────────

models:
  # Pretrained RBPNet weights — copied from NAS
  parnet.7m-0.0:   resources/models/parnet.7m-0.0.pt    # 29 MB, 2025-01-10_7M_penalized
  parnet.21m-0.0:  resources/models/parnet.21m-0.0.pt   # 84 MB, standard 21M model (penalty=0)

metadata:
  # RBP x cell-type experiment table (parnet ENCODE eCLIP, 223 experiments)
  full_rbp_set: resources/metadata/full_rbp_set.tsv
  # RBP functional annotations (Yeo-lab, Jun 2025)
  rbp_functions: resources/metadata/yeo_RBP_annotation.function.csv
  # Chromosome-level train / val / test split definitions
  train_val_test_splits: config/config.train_validation_test_split.yaml

parnet_encore_eclip:
  # Lightweight metadata accompanying the full 2000 nt training dataset
  metadata: resources/parnet-encore-eclip/metadata.txt

# ── NAS-resident files (not copied — too large or not needed locally) ────────────

nas:
  # 48 GB — full preprocessed eCLIP training data (2000 nt windows, all 223 RBPs).
  # Used only by prepare_datasets.py.ipynb to generate the local filtered dataset.
  # After running prepare_datasets, subsequent training reads from results/ only.
  parnet_encore_eclip_data_2000nt: resources/parnet-encore-eclip/2000nt_windows/gencode.v48.annotation.transcripts.merged.tiles.data.filtered.splits.pt

  # HuggingFace-format 600 nt dataset (alternative input, not used in current demo)
  parnet_encore_eclip_data_600nt_base: /mnt/storage-nas-fast-2/research/projects/hzm/parnet-analyses/MANUAL/parnet_encore_eclip/parnet_preprocessed_training_data/600nt_windows/encode.filtered.hfds/
